services:
  # Backend Web Service with WebSocket Support
  - type: web
    name: ai-interviewer-backend
    runtime: node
    rootDir: apps/backend
    buildCommand: bun install && bunx prisma generate && bunx prisma db push
    startCommand: bun run index.ts
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.1-flash-live-preview
      - key: GEMINI_EVAL_MODEL
        value: gemini-flash-latest
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # Frontend Static Site
  - type: web
    name: ai-interviewer-frontend
    runtime: static
    rootDir: apps/frontend
    buildCommand: bun install && bun run build.ts
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: BUN_PUBLIC_BACKEND_URL
        sync: false
